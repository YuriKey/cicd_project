version: '3.8'

services:
  selenoid:
    image: aerokube/selenoid
    ports:
      - "4444:4444"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./config/:/etc/selenoid/"

  tests:
    build:
      context: .
      dockerfile: Dockerfile.tests  # Явно указываем имя файла
    volumes:
      - "./reports:/app/reports"
    environment:
      - SELENOID_URL=http://selenoid:4444/wd/hub