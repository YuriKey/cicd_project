version: '3.8'

services:
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - ./reports:/app/reports
    environment:
      - SELENIUM_HOST=http://selenoid:4444/wd/hub
    depends_on:
      selenoid:
        condition: service_healthy
    networks:
      - selenoid-net
    command: >
      sh -c "
      python -m pytest --alluredir=reports/allure-results --junitxml=reports/junit/results.xml &&
      allure generate reports/allure-results -o reports/allure-report --clean
      "

  selenoid:
    image: aerokube/selenoid:1.10.7
    ports:
      - "4444:4444"
    volumes:
      - ./selenoid/config:/etc/selenoid:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./selenoid/logs:/opt/selenoid/logs
    environment:
      - DOCKER_API_VERSION=1.43
      - OVERRIDE_VIDEO_OUTPUT_DIR=/opt/selenoid/video
      - OVERRIDE_LOG_OUTPUT_DIR=/opt/selenoid/logs
      - TZ=Europe/Moscow
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:4444/status"]
      interval: 5s
      timeout: 3s
      retries: 5
    command: >
      ["-limit", "10",
       "-timeout", "1m",
       "-service-startup-timeout", "2m",
       "-conf", "/etc/selenoid/browsers.json",
       "-container-network", "autotests-krenev_selenoid-net"]
    networks:
      - selenoid-net

networks:
  selenoid-net:
    driver: bridge