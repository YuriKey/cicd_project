services:
  tests:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./reports:/app/reports
    depends_on:
      - selenoid
    environment:
      SELENIUM_PORT: 4444
    networks:
      - test-network

  selenoid:
    image: aerokube/selenoid:1.11.0

    ports:
      - "4445:4444"
    volumes:
      - ./browsers.json:/etc/browsers.json
      - /tmp/videos:/opt/selenium/videos
      - /tmp/logs:/opt/selenium/logs
      - /var/run/docker.sock:/var/run/docker.sock
    command: [
      "-conf", "/etc/browsers.json",
      "-disable-docker=false",
      "-docker-uri", "unix:///var/run/docker.sock",
      "-docker-api-version", "1.43",
      "-log-output-dir", "/opt/selenium/logs",
      "-disable-privileged=false"
    ]
    networks:
      - test-network

networks:
  test-network:
    driver: bridge