#docker-compose.yml
services:
  tests:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./reports:/app/reports
    depends_on:
      - selenoid
    environment:
      SELENOID_HOST: selenoid
      SELENIUM_PORT: 4444
    privileged: true
    networks:
      - test-network

  selenoid:
    image: aerokube/selenoid:latest
    ports:
      - "4444:4444"
    environment:
      - OVERRIDE_SELENIUM_PORT=4444
    volumes:
      - ./selenoid_config/browsers.json:/etc/selenoid/browsers.json
      - /tmp/videos:/opt/selenoid/video
      - /tmp/logs:/opt/selenoid/logs
      - /var/run/docker.sock:/var/run/docker.sock
    privileged: true
    command: >
      -conf /etc/selenoid/browsers.json
      -log-output-dir /opt/selenoid/logs
      -video-output-dir /opt/selenoid/video
      -container-network=autotests-krenev_test-network
      -disable-privileged=false
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
