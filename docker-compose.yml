version: '3.8'

services:
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - ./reports:/app/reports
    depends_on:
      - selenoid
    networks:
      - selenoid-net

  selenoid:
    image: aerokube/selenoid:latest
    command: >
      -conf /etc/selenoid/browsers.json
      -video-output-dir /opt/selenoid/video
      -log-output-dir /opt/selenoid/logs
      -docker-host tcp://dind:2375
    volumes:
      - ./selenoid/config:/etc/selenoid:ro
    networks:
      - selenoid-net

  dind:
    image: docker:dind
    privileged: true
    command: --storage-driver=overlay2
    networks:
      - selenoid-net

networks:
  selenoid-net:
    driver: bridge