#docker-compose.yml
services:
  testrunner:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./reports:/app/reports
    depends_on:
      - selenoid
    environment:
      SELENOID_PORT: 4444
    networks:
      - test-network

  selenoid:
    image: aerokube/selenoid:1.11.3
    volumes:
      - ./browsers.json:/etc/browsers.json
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "4444:4444"
    command: [
      "-conf", "/etc/browsers.json",
#      "-disable-docker=true",
      "-limit", "5",
      "-service-startup-timeout", "2m",
      "-session-attempt-timeout", "2m"
    ]
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
    name: test-network
