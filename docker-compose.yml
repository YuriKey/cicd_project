version: '3.8'

services:
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - ./reports:/app/reports
    depends_on:
      selenoid:
        condition: service_healthy
    networks:
      - selenoid-net
    environment:
      SELENIUM_HOST: "http://selenoid:4444/wd/hub"

  selenoid:
    image: aerokube/selenoid:1.10.7  # явно указываем стабильную версию
    ports:
      - "4444:4444"
    volumes:
      - ./selenoid/config:/etc/selenoid:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./selenoid/video:/opt/selenoid/video
      - ./selenoid/logs:/opt/selenoid/logs
    networks:
      - selenoid-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:4444/status"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: >
      -limit 10
      -timeout 2m
      -service-startup-timeout 2m
      -conf /etc/selenoid/browsers.json
      -video-output-dir /opt/selenoid/video
      -log-output-dir /opt/selenoid/logs

networks:
  selenoid-net:
    driver: bridge