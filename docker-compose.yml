services:
  tests:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./reports:/app/reports
    depends_on:
      - selenoid
    environment:
      SELENIUM_PORT: 4444
    networks:
      - test-network

#  selenoid:
#    image: aerokube/selenoid:latest-release
#    volumes:
#      - ./browsers.json:/etc/browsers.json
#      - /tmp/videos:/opt/selenium/videos
#      - /tmp/logs:/opt/selenium/logs
#    ports:
#      - "4444:4444"
#    command: ["-conf", "/etc/browsers.json", "-disable-docker"]
#    networks:
#      - test-network
  selenoid:
    image: aerokube/selenoid:latest-release
    volumes:
      - ./browsers.json:/etc/browsers.json
      - /tmp/videos:/opt/selenium/videos
      - /tmp/logs:/opt/selenium/logs
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "4444:4444"
    command: [ "-conf", "/etc/browsers.json", "-disable-docker=false", "-log-output-dir", "/opt/selenium/logs" ]
    networks:
      - test-network

networks:
  test-network:
    driver: bridge