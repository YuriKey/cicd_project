version: '3.8'

services:
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test-runner
    volumes:
      - ./reports:/app/reports
    depends_on:
      - selenoid
    environment:
      - SELENIUM_HOST=selenoid
      - SELENIUM_PORT=4444
    networks:
      - selenoid-net

  selenoid:
    image: aerokube/selenoid:latest-release
    ports:
      - "4444:4444"
      - "5900:5900"
    volumes:
      - ./browsers:/etc/selenoid/browsers
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - OVERRIDE_VIDEO_OUTPUT_DIR=/video
      - ENABLE_VNC=true
    networks:
      - selenoid-net

networks:
  selenoid-net:
    driver: bridge