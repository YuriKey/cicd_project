#docker-compose.yml
services:
  testrunner:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./reports:/app/reports
    depends_on:
      - selenoid
    environment:
      SELENIUM_PORT: 4444
    networks:
      - test-network

  selenoid:
    image: aerokube/selenoid:latest-release
    volumes:
      - ./browsers.json:/etc/browsers.json
      - /tmp/videos:/opt/selenoid/videos
      - /tmp/logs:/opt/selenoid/logs
      - /var/run/docker.sock:/var/run/docker.sock
#    ports:
#      - "4444:4444"
    privileged: true
    command: [
      "-conf", "/etc/browsers.json",
      "-disable-docker=false",
      "-log-output-dir", "/opt/selenoid/logs",
#      "-container-network", "AutoTests-Krenev_test-network"
    ]
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
