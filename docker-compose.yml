services:
  tests:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./reports:/app/reports
    depends_on:
      - selenoid
    environment:
      SELENIUM_PORT: 4444
    networks:
      - test-network

  selenoid:
    image: aerokube/selenoid:latest
    ports:
      - "4445:4444"
    volumes:
      - ./browsers.json:/etc/selenoid/browsers.json
      - /tmp/videos:/opt/selenoid/video
      - /tmp/logs:/opt/selenoid/logs
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      -conf /etc/selenoid/browsers.json
      -log-output-dir /opt/selenoid/logs
      -video-output-dir /opt/selenoid/video
      -container-network=test-network
      -disable-privileged=false
    networks:
      - test-network

networks:
  test-network:
    external: true

