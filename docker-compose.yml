version: '3.8'

services:
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - ./reports:/app/reports
      - ./selenoid/logs:/opt/selenoid/logs
    environment:
      - SELENIUM_HOST=http://selenoid:4444/wd/hub
    depends_on:
      - selenoid
    networks:
      - selenoid-net
    command: >
      sh -c "
      python -m pytest --alluredir=reports/allure-results --junitxml=reports/junit/results.xml &&
      allure generate reports/allure-results -o reports/allure-report --clean
      "

  selenoid:
    image: aerokube/selenoid:latest
    ports:
      - "4444:4444"
    volumes:
      - ./selenoid/config:/etc/selenoid:ro
      - ./selenoid/logs:/opt/selenoid/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - ./selenoid/video:/opt/selenoid/video
    environment:
      - DOCKER_API_VERSION=1.43
      - OVERRIDE_VIDEO_OUTPUT_DIR=/opt/selenoid/video
      - OVERRIDE_LOG_OUTPUT_DIR=/opt/selenoid/logs
      - TZ=Europe/Moscow
    command: >
      ["-conf", "/etc/selenoid/browsers.json",
       "-video-output-dir", "/opt/selenoid/video",
       "-log-output-dir", "/opt/selenoid/logs",
       "-container-network", "autotests-krenev_selenoid-net"]  # Явно указываем сеть
    networks:
      - selenoid-net

networks:
  selenoid-net:
    driver: bridge