version: '3.8'

services:
  selenoid:
    build: ./docker/selenoid
    ports:
      - "4444:4444"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    restart: unless-stopped

  test-runner:
    build: ./docker/test-runner
    depends_on:
      - selenoid
    volumes:
      - ./reports:/app/reports
      - type=volume,source=test-cache,target=/root/.cache
    environment:
      - SELENOID_URL=http://selenoid:4444/wd/hub
    restart: on-failure